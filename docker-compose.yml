version: '3.9'

services:
  gateway:
    image: node:22
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: sh -c "npm install && npm run dev:gateway"
    ports:
      - '8080:8080'

  client:
    image: node:22
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      GATEWAY_URL: ws://gateway:8080/connect
    command: sh -c "npm install && npm run dev:client"
    depends_on:
      - gateway
