# ============================================================
# Portivox — MySQL 8 Database (separate compose file)
# ============================================================
#
# ── Standalone (DB only) ─────────────────────────────────────
#   docker compose -f docker-compose.mysql.yml up -d
#
#   Run this BEFORE the main stack so the network already
#   exists when the gateway starts.
#
# ── Full stack with local MySQL ──────────────────────────────
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.mysql.yml \
#                  up --build
#
#   In this mode the gateway waits for MySQL to pass its
#   health-check before starting (via the depends_on override
#   in this file).
#
# ── Required .env additions ──────────────────────────────────
#   MYSQL_ROOT_PASSWORD=<strong root password>
#   MYSQL_PASSWORD=<strong portivox user password>
#   DATABASE_URL=mysql://portivox:${MYSQL_PASSWORD}@mysql:3306/portivox
#   DB_PROVIDER=mysql
#
# ── Migrations (run once after first start) ──────────────────
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.mysql.yml \
#                  run --rm gateway \
#                  node scripts/prisma-runner.cjs migrate deploy
# ============================================================

services:

  # ── MySQL 8 ──────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: portivox-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}"
      MYSQL_DATABASE:      "portivox"
      MYSQL_USER:          "portivox"
      MYSQL_PASSWORD:      "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}"

    # Expose on loopback only — keeps the DB off the public interface.
    # Remove this port mapping entirely if you never need external GUI tools.
    ports:
      - "127.0.0.1:3306:3306"

    volumes:
      # Named volume for durable data storage
      - mysql_data:/var/lib/mysql
      # Optional: drop *.sql / *.sh seed scripts here for first-boot init
      # - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max-allowed-packet=64M
      - --innodb-buffer-pool-size=256M
      - --slow-query-log=1
      - --long-query-time=2

    healthcheck:
      # Use root so the check works even before the portivox user is created.
      test:
        - "CMD"
        - "mysqladmin"
        - "ping"
        - "-h"
        - "127.0.0.1"
        - "-u"
        - "root"
        - "--password=${MYSQL_ROOT_PASSWORD}"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    networks:
      - portivox-network

  # ── Gateway depends-on override ──────────────────────────────
  # When this file is merged with docker-compose.yml the gateway
  # waits for MySQL's health-check before it starts.  This block
  # has no effect when this file is run standalone.
  gateway:
    depends_on:
      mysql:
        condition: service_healthy

# ── Volumes ───────────────────────────────────────────────────
volumes:
  mysql_data:
    name: portivox-mysql-data

# ── Networks ──────────────────────────────────────────────────
# Uses the same network name as docker-compose.yml so containers
# from both files can resolve each other by service name.
networks:
  portivox-network:
    name: portivox-network
    driver: bridge
