name: portivox-ci

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: OpenAPI Export
        run: npm run openapi:export

      - name: OpenAPI SDK Compatibility Check
        run: npm run openapi:check-sdk-compat

      - name: Smoke Test
        run: npm run test:smoke

      - name: TCP Smoke Test
        run: npm run test:smoke:tcp

      - name: Chunk Integration Test
        run: npm run test:chunk

      - name: Audit Replay Integration Test
        run: npm run test:audit-replay

      - name: API Contract Test
        run: npm run test:api-contract

      - name: Rate Limit Contract Test
        run: npm run test:rate-limit-contract

      - name: Security CORS Contract Test
        run: npm run test:security-cors-contract

      - name: Payload Validation Contract Test
        run: npm run test:payload-validation-contract

      - name: Idempotency Contract Test
        run: npm run test:idempotency-contract

      - name: Audit Query Contract Test
        run: npm run test:audit-query-contract

      - name: SDK Integration Test
        run: npm run test:sdk

      - name: Auth Integration Test
        run: npm run test:auth

  docker-smoke:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Docker Compose
        run: docker compose config

      - name: Docker Smoke Test
        run: npm run test:smoke:docker

      - name: Docker diagnostics (on failure)
        if: failure()
        run: |
          docker ps -a || true
          docker compose logs --no-color gateway || true
          docker compose logs --no-color client || true
          docker compose logs --no-color nginx || true
          docker compose logs --no-color redis || true

  publish-client:
    runs-on: ubuntu-latest
    needs: [build, docker-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build standalone client package
        run: npm run -w packages/portivox-client build

      - name: Verify npm auth
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check if version already published
        id: version_check
        shell: bash
        run: |
          set -euo pipefail
          PKG_NAME=$(node -p "require('./packages/portivox-client/package.json').name")
          PKG_VERSION=$(node -p "require('./packages/portivox-client/package.json').version")
          echo "name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Version already published: $PKG_NAME@$PKG_VERSION"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Version not published yet: $PKG_NAME@$PKG_VERSION"
          fi

      - name: Publish portivox-client
        if: steps.version_check.outputs.should_publish == 'true'
        run: npm publish --workspace packages/portivox-client --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip publish notice
        if: steps.version_check.outputs.should_publish != 'true'
        run: echo "Skipping publish because version is already on npm"
