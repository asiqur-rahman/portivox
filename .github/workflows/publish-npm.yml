name: publish-portivox-client

on:
  workflow_dispatch:
  push:
    tags:
      - "portivox-client-v*"

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/portivox-client-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build standalone client package
        run: npm run -w packages/portivox-client build

      - name: Verify npm auth
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check if version already published
        id: version_check
        shell: bash
        run: |
          set -euo pipefail
          PKG_NAME=$(node -p "require('./packages/portivox-client/package.json').name")
          PKG_VERSION=$(node -p "require('./packages/portivox-client/package.json').version")
          echo "name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Version already published: $PKG_NAME@$PKG_VERSION"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Version not published yet: $PKG_NAME@$PKG_VERSION"
          fi

      - name: Publish portivox-client
        if: steps.version_check.outputs.should_publish == 'true'
        run: npm publish --workspace packages/portivox-client --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip publish notice
        if: steps.version_check.outputs.should_publish != 'true'
        run: echo "Skipping publish because version is already on npm"
