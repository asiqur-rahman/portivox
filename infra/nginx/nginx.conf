worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile          on;
  tcp_nopush        on;
  tcp_nodelay       on;
  keepalive_timeout  65;
  keepalive_requests 1000;
  server_tokens      off;

  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    # No server_name — accepts all traffic regardless of hostname.
    # Bind your domain to this server's IP externally (DNS / CDN / reverse proxy).

    set $gw_http gateway:8080;
    set $gw_ws   gateway:7000;

    # ── WebSocket tunnel connection ───────────────────────────
    location /connect {
      proxy_pass         http://$gw_ws;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        $connection_upgrade;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
    }

    # ── Gateway API ───────────────────────────────────────────
    location /api/ {
      proxy_pass         http://$gw_http;
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # ── IP-protection access links ────────────────────────────
    location /l/ {
      proxy_pass         http://$gw_http;
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 10s;
    }

    # ── Stable redirect / tunnel status URLs ─────────────────
    location /r/ {
      proxy_pass         http://$gw_http;
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 10s;
    }

    # ── Health / readyz / OpenAPI ─────────────────────────────
    location ~ ^/(healthz|readyz|openapi\.json)$ {
      proxy_pass         http://$gw_http;
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 10s;
    }

    # ── Prometheus metrics — internal access only ─────────────
    # Restricted to RFC-1918 / loopback ranges so Prometheus metrics are
    # not exposed on the public internet. Set METRICS_TOKEN in .env for
    # additional bearer-token auth at the gateway layer.
    location /metrics {
      allow 127.0.0.0/8;
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      deny  all;

      proxy_pass         http://$gw_http;
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 10s;
    }

    # ── Static SPA, fallback to gateway for tunnel traffic ───
    # Serve built frontend assets directly; anything not found
    # (e.g. requests to tunnel subdomains) falls through to the
    # gateway which routes by Host header.
    location / {
      root      /usr/share/nginx/html;
      try_files $uri $uri/ @gateway;
      add_header Cache-Control          "public, max-age=3600" always;
      add_header X-Content-Type-Options nosniff              always;
      add_header X-Frame-Options        DENY                  always;
      add_header Referrer-Policy        no-referrer           always;
    }

    location @gateway {
      proxy_pass         http://$gw_http;
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }
  }
}
