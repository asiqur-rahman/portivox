worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile          on;
  tcp_nopush        on;
  tcp_nodelay       on;
  keepalive_timeout  65;
  keepalive_requests 1000;
  server_tokens      off;

  # Limit request body size at the nginx layer — rejects DoS-sized payloads
  # before they reach Fastify, saving memory and CPU.
  client_max_body_size 10m;

  # Strip the X-Powered-By header from all proxied responses so internal
  # framework information is not disclosed to clients.
  proxy_hide_header X-Powered-By;

  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ── Server 1: Tunnel subdomains → gateway (bypasses SPA) ─────
  # Matches *.${ROOT_DOMAIN} (e.g. demo.portivox.braintechsolution.com).
  # Must appear before the catch-all block so nginx prefers the regex
  # server_name over the default server for subdomain requests.
  # envsubst replaces ${ROOT_DOMAIN_REGEX} at container startup.
  server {
    listen 80;
    server_name ~^[^.]+\.${ROOT_DOMAIN_REGEX}$;

    set $gw_http gateway:8080;
    set $gw_ws   gateway:7000;

    # WebSocket on subdomains is NOT used for tunnel traffic, but keeping the
    # /connect block here ensures the WS handshake never hits Fastify (port 8080)
    # if routing logic routes the main domain here by mistake.
    location /connect {
      proxy_pass         http://$gw_ws;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        $connection_upgrade;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $remote_addr;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
    }

    location / {
      proxy_pass         http://$gw_http;
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $remote_addr;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      # Disable response buffering so nginx forwards gateway bytes to the
      # browser immediately instead of buffering the full response body first.
      # This halves the memory consumed per request and reduces time-to-first-byte.
      proxy_buffering    off;
    }
  }

  # ── Server 2: Main domain + catch-all → SPA + API ────────────
  server {
    listen 80 default_server;
    # default_server ensures nginx routes here for any Host that does not match
    # Server 1's subdomain regex — including the main domain, bare-IP health
    # checks, localhost, and anything else not matched above.

    set $gw_http gateway:8080;
    set $gw_ws   gateway:7000;

    # ── WebSocket tunnel connection ───────────────────────────
    location /connect {
      proxy_pass         http://$gw_ws;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        $connection_upgrade;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $remote_addr;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
    }

    # ── Gateway API ───────────────────────────────────────────
    location /api/ {
      proxy_pass         http://$gw_http;
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $remote_addr;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # ── IP-protection access links ────────────────────────────
    location /l/ {
      proxy_pass         http://$gw_http;
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $remote_addr;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 10s;
    }

    # ── Stable redirect / tunnel status URLs ─────────────────
    location /r/ {
      proxy_pass         http://$gw_http;
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $remote_addr;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 10s;
    }

    # ── Health / readyz / OpenAPI ─────────────────────────────
    location ~ ^/(healthz|readyz|openapi\.json)$ {
      proxy_pass         http://$gw_http;
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $remote_addr;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 10s;
    }

    # ── Prometheus metrics — internal access only ─────────────
    location /metrics {
      allow 127.0.0.0/8;
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      deny  all;

      proxy_pass         http://$gw_http;
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $remote_addr;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 10s;
    }

    # ── Service worker script — never let the browser cache this file ────────
    # The SPA's 1h Cache-Control below would otherwise apply to /sw.js too,
    # delaying how fast clients pick up a fixed/updated worker (e.g. the fix
    # for stale-cached API responses) by up to an hour.
    location = /sw.js {
      root       /usr/share/nginx/html;
      add_header Cache-Control          "no-cache" always;
      add_header X-Content-Type-Options nosniff    always;
    }

    # ── Static SPA ────────────────────────────────────────────
    # All paths not matched above serve the React SPA.
    # /index.html is the explicit final fallback so nginx never
    # proxies unknown paths to the gateway (which would return
    # INVALID_HOST for the main domain).
    location / {
      root       /usr/share/nginx/html;
      index      index.html;
      try_files  $uri $uri/ /index.html;
      add_header Cache-Control          "public, max-age=3600"                                                                     always;
      add_header X-Content-Type-Options nosniff                                                                                   always;
      add_header X-Frame-Options        DENY                                                                                      always;
      add_header Referrer-Policy        no-referrer                                                                               always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' wss:;" always;
    }
  }
}
