worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  keepalive_requests 1000;
  server_tokens off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream gateway_http {
    server gateway:8080;
    keepalive 64;
  }

  upstream gateway_ws {
    server gateway:7000;
    keepalive 64;
  }

  # Replace with your real root domain in production.
  # Example:
  # - App domain: portivox.braintechsolution.com
  # - Tunnel wildcard: *.portivox.braintechsolution.com

  server {
    listen 80;
    server_name portivox.braintechsolution.com;

    location /api/ {
      proxy_pass http://gateway_http;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    location /connect {
      proxy_pass http://gateway_ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy no-referrer always;
    }
  }

  server {
    listen 80;
    server_name ~^(?<subdomain>.+)\.portivox\.braintechsolution\.com$;

    location / {
      proxy_pass http://gateway_http;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_read_timeout 60s;
    }
  }
}

