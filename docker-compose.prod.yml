services:
  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile.prod
    container_name: portivox-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # In production, terminate TLS on 443 (LB or nginx with certs)
    depends_on:
      gateway:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: apps/gateway-server/Dockerfile
    container_name: portivox-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: "production"
      DATABASE_URL: "${DATABASE_URL}"
      GATEWAY_PORT: "8080"
      GATEWAY_WS_PORT: "7000"
      ROOT_DOMAIN: "${ROOT_DOMAIN}"
      AUTH_REQUIRED: "true"
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET}"
      AUTH_API_KEY_SCOPES: "tunnel:create,tunnel:read,tunnel:delete,key:manage"
      MAX_REQUEST_BODY_BYTES: "1048576"
      TUNNEL_RESPONSE_TIMEOUT_MS: "20000"
      WS_IDLE_TIMEOUT_MS: "30000"
      REGISTRY_BACKEND: "redis"
      REDIS_URL: "redis://redis:6379"
      REDIS_KEY_PREFIX: "portivox:registry"
      REGISTRY_LEASE_TTL_MS: "30000"
      TCP_TUNNEL_ENABLED: "true"
      TCP_TUNNEL_BIND_HOST: "0.0.0.0"
      TCP_PUBLIC_HOST: "${TCP_PUBLIC_HOST}"
      TCP_PUBLIC_PORT_START: "${TCP_PUBLIC_PORT_START}"
      TCP_PUBLIC_PORT_END: "${TCP_PUBLIC_PORT_END}"
      SECURITY_HEADERS_ENABLED: "true"
      IDEMPOTENCY_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS}"
      CORS_ALLOW_CREDENTIALS: "true"
    ports:
      - "${TCP_PUBLIC_PORT_START}-${TCP_PUBLIC_PORT_END}:${TCP_PUBLIC_PORT_START}-${TCP_PUBLIC_PORT_END}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: portivox-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  redis_data:

networks:
  default:
    name: portivox-prod-network
